<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>土耳其隨身特助</title>
  
  <!-- PWA 核心引入 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12857F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 外部樣式與圖標 CDN (開源免費) -->
  <script src="https://tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com">
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#faf7f2] text-[#2c2c2c] antialiased select-none pb-20">

  <!-- App 主頂欄 -->
  <header class="sticky top-0 z-50 bg-[#152238] text-white px-4 py-3 shadow-md safe-top">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-base font-bold tracking-wide">土耳其隨身特助</h1>
        <p class="text-[10px] text-slate-300">智慧地圖 · 天氣警報 · 雙向翻譯</p>
      </div>
      <div id="connection-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">
        🟢 連線中
      </div>
    </div>
  </header>

  <!-- 功能分頁切換容器 -->
  <main id="app-container" class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- 地圖與天氣警報模組 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-[#e8dfd1] space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 text-xs font-semibold text-[#152238]">
          <i data-lucide="map" class="w-4 h-4 text-[#12857F]"></i> 開源全螢幕定位地圖
        </div>
        <div class="flex gap-2">
          <button id="btn-gps" class="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-95 transition-all">
            <i data-lucide="map-pin" class="w-4 h-4 text-[#12857F]"></i>
          </button>
          <button id="btn-fullscreen" class="p-2 bg-slate-100 rounded-xl hover:bg-slate-200 active:scale-95 transition-all">
            <i data-lucide="compass" class="w-4 h-4 text-[#c79a3c]"></i>
          </button>
        </div>
      </div>
      
      <!-- 地圖容器 -->
      <div id="map-wrapper" class="relative rounded-xl overflow-hidden border border-[#e8dfd1] h-48 w-full transition-all duration-300">
        <div id="map" class="w-full h-full z-0"></div>
      </div>

      <!-- 熱氣球即時氣象警報 -->
      <div id="balloon-alert" class="rounded-xl p-3 border hidden transition-all duration-300">
        <div class="flex items-center justify-between">
          <p class="text-xs font-bold flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3"></i> 卡帕多奇亞熱氣球指標</p>
          <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-white/50 font-medium">LIVE</span>
        </div>
        <p id="balloon-title" class="text-sm font-bold mt-1">取得氣象中…</p>
        <p id="balloon-desc" class="text-[11px] opacity-90 mt-0.5 leading-relaxed"></p>
      </div>
    </section>

    <!-- 即時匯率換算 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-[#e8dfd1]">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-1.5 text-xs font-semibold text-[#152238]">
          <i data-lucide="coins" class="w-4 h-4 text-[#12857F]"></i> 即時匯率計算
        </div>
        <button id="btn-refresh-rates" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
          🔄 點擊更新
        </button>
      </div>
      <div class="flex gap-2">
        <input id="currency-input" type="number" inputMode="decimal" value="1000" class="flex-1 text-base rounded-lg border border-[#e8dfd1] px-3 py-1.5 outline-none font-mono">
        <select id="currency-base" class="text-xs font-bold rounded-lg border border-[#e8dfd1] px-2 bg-slate-50">
          <option value="TWD">TWD 台幣</option>
          <option value="TRY" selected>TRY 里拉</option>
          <option value="USD">USD 美金</option>
        </select>
      </div>
      <div id="currency-list" class="mt-3 space-y-2"></div>
    </section>

    <!-- 口語打字應急翻譯 -->
    <section class="bg-[#152238] rounded-2xl p-4 shadow-sm text-white space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5 text-xs font-medium text-white/90">
          <i data-lucide="mic" class="w-4 h-4 text-[#c79a3c]"></i> 雙向應急口語翻譯
        </div>
        <button id="btn-toggle-lang" class="text-[10px] border border-white/20 rounded-full px-2 py-0.5 flex items-center gap-1">
          <span id="lang-src">中文</span> 🔄 <span id="lang-tgt">土耳其文</span>
        </button>
      </div>
      <div class="flex gap-1.5 bg-white/5 p-1 rounded-xl border border-white/10">
        <input id="translate-input" type="text" placeholder="輸入中文進行發聲翻譯…" class="flex-1 bg-transparent text-xs text-white px-2 py-2 outline-none">
        <button id="btn-translate" class="bg-[#12857F] text-xs px-3 py-1.5 rounded-lg font-semibold active:scale-95 transition-all">翻譯</button>
      </div>
      <div id="translate-result-box" class="hidden rounded-xl p-3 bg-white/5 border border-white/10 text-left space-y-2">
        <div>
          <p class="text-[9px] text-white/40">原文</p>
          <p id="translate-orig" class="text-xs text-white font-medium"></p>
        </div>
        <div class="pt-2 border-t border-white/5 flex justify-between items-start gap-2">
          <div>
            <p class="text-[9px] text-[#c79a3c]">土耳其現場點讀結果</p>
            <p id="translate-out" class="text-sm text-white font-bold mt-0.5"></p>
          </div>
          <button id="btn-speak" class="p-1.5 bg-white/10 rounded-lg active:bg-white/20">
            <i data-lucide="volume-2" class="w-4 h-4 text-[#c79a3c]"></i>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部固定導覽列 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 border-t border-[#e8dfd1] backdrop-blur-md px-6 py-2 flex justify-around items-center z-50 safe-bottom">
    <button class="flex flex-col items-center gap-0.5 text-[#12857F]">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[9px] font-medium">導覽地圖</span>
    </button>
    <button onclick="alert('打包清單功能已就緒，即將整合入主介面')" class="flex flex-col items-center gap-0.5 text-slate-400">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span class="text-[9px]">行李打包</span>
    </button>
    <button onclick="alert('裝置相簿多檔上傳功能已就緒')" class="flex flex-col items-center gap-0.5 text-slate-400">
      <i data-lucide="image" class="w-5 h-5"></i>
      <span class="text-[9px]">共享相簿</span>
    </button>
  </nav>

  <!-- 註冊 PWA Service Worker 與初始化腳本 -->
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // 使用相對路徑註冊，完美相容 GitHub Pages 子目錄路徑
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('PWA Service Worker 註冊成功:', reg.scope))
          .catch(err => console.error('PWA 註冊失敗:', err));
      });
    }
  </script>
</body>
</html>
