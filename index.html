<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>土耳其旅遊小幫手</title>
  <meta name="theme-color" content="#152238" />
  <meta name="description" content="10天土耳其經典行程隨身工具：行程、記帳、匯率、旅遊須知" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23152238'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23C79A3C' stroke-width='24'/%3E%3Ccircle cx='256' cy='256' r='90' fill='%2312857F'/%3E%3Ccircle cx='256' cy='256' r='36' fill='%23C79A3C'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title">
        <span class="nazar">◎</span>
        <div>
          <h1>神秘精靈國度．土耳其</h1>
          <p>2026/08/14－2026/08/23</p>
        </div>
      </div>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-tab="itinerary">
        <span class="nav-icon">🧭</span><span>行程</span>
      </button>
      <button class="nav-btn" data-tab="expense">
        <span class="nav-icon">💰</span><span>記帳</span>
      </button>
      <button class="nav-btn" data-tab="currency">
        <span class="nav-icon">💱</span><span>匯率</span>
      </button>
      <button class="nav-btn" data-tab="notes">
        <span class="nav-icon">ℹ️</span><span>須知</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js")
          .then((reg) => console.log("Service Worker 註冊成功：", reg.scope))
          .catch((err) => console.error("Service Worker 註冊失敗：", err));
      });
    }
  </script>
</body>
</html>
